name: release

run-name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_label || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_label:
        description: Optional label for a manual build run
        required: false
        type: string
      upload_to_connect:
        description: Upload the signed iOS IPA to App Store Connect
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  artifact-metadata: read

jobs:
  validate-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Niyien canonical schema requires release tags to be bare base versions
      # (e.g. v1.6.4). Suffixes like v1.6.4-niyien.1 are reserved for the
      # actions-run schema (X.Y.Z-ni.<RUN_NUMBER>) emitted by build.rs and
      # would collide with the custom comparator in src/distribution.rs.
      - name: Validate tag name
        run: |
          tag='${{ github.ref_name }}'
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $tag does not match ^v[0-9]+\\.[0-9]+\\.[0-9]+$ (bare base only)." >&2
            echo "Suffixed pre-release tags are not allowed. Trigger workflow_dispatch instead." >&2
            exit 1
          fi

  build:
    needs: [validate-tag]
    if: ${{ always() && (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        targets: [
          { os: ubuntu-22.04,   type: linux },
          { os: macos-14,      type: macos },
          { os: windows-2022,  type: windows },
          { os: windows-2022,  type: android },
          { os: macos-26,      type: ios }
        ]
    name: Build gyroflow(niyien) for ${{ matrix.targets.type }}
    runs-on: ${{ matrix.targets.os }}
    timeout-minutes: ${{ matrix.targets.type == 'ios' && 180 || 360 }}
    concurrency:
      group: ${{ matrix.targets.type == 'ios' && 'niyien-ios-app-store-upload' || format('release-{0}-{1}', github.run_id, matrix.targets.type) }}
      cancel-in-progress: false
    env:
      IOS_UPLOAD_TO_CONNECT: ${{ inputs.upload_to_connect && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.targets.type == 'ios' && '0' || '1' }}

      - name: Prepare shared mobile version
        if: matrix.targets.type == 'android' || matrix.targets.type == 'ios'
        shell: bash
        run: ${{ matrix.targets.type == 'android' && 'python' || 'python3' }} _scripts/mobile_version.py --prepare-ci

      - name: Test iOS build helpers
        if: matrix.targets.type == 'ios'
        run: python3 -B -m unittest discover -s _scripts/tests -p 'test_ios*.py'

      - name: Check iOS configuration
        id: config
        if: matrix.targets.type == 'ios'
        env:
          IOS_CERTIFICATES: ${{ secrets.IOS_CERTIFICATES }}
          IOS_CERTIFICATE_PWD: ${{ secrets.IOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATES: ${{ secrets.MACOS_CERTIFICATES }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_ACCOUNT_USER: ${{ secrets.MACOS_ACCOUNT_USER }}
          MACOS_ACCOUNT_PASS: ${{ secrets.MACOS_ACCOUNT_PASS }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_SIGNING_FINGERPRINT: ${{ vars.IOS_SIGNING_FINGERPRINT }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID || secrets.APPSTORE_ISSUER_ID || secrets.MACOS_ITCONNECT_ISSUER }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID || secrets.APPSTORE_API_KEY_ID || secrets.MACOS_ITCONNECT_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY || secrets.MACOS_ITCONNECT_KEY }}
        run: python3 _scripts/ios_ci.py check-config

      - name: Install Apple Distribution certificate
        if: matrix.targets.type == 'ios' && steps.config.outputs.upload_enabled == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATES || secrets.MACOS_CERTIFICATES }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PWD || secrets.MACOS_CERTIFICATE_PWD }}

      - name: Download App Store provisioning profiles
        if: matrix.targets.type == 'ios' && steps.config.outputs.upload_enabled == 'true' && steps.config.outputs.profile_mode == 'api'
        id: provisioning
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: ${{ steps.config.outputs.bundle_identifier }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID || secrets.APPSTORE_ISSUER_ID || secrets.MACOS_ITCONNECT_ISSUER }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID || secrets.APPSTORE_API_KEY_ID || secrets.MACOS_ITCONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY || secrets.MACOS_ITCONNECT_KEY }}

      - name: Select matching provisioning profile
        if: matrix.targets.type == 'ios' && steps.config.outputs.upload_enabled == 'true'
        env:
          IOS_PROVISIONING_PROFILES: ${{ steps.provisioning.outputs.profiles }}
          IOS_PROFILE_MODE: ${{ steps.config.outputs.profile_mode }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_SIGNING_FINGERPRINT: ${{ vars.IOS_SIGNING_FINGERPRINT }}
        run: python3 _scripts/ios_ci.py prepare-signing

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.targets.type }}-gyroflow-niyien-${{ matrix.targets.type == 'ios' && hashFiles('_scripts/ios.just', '_scripts/common.just', '_scripts/ios_native_deps.py') || matrix.targets.type == 'macos' && hashFiles('_scripts/macos.just') || matrix.targets.type == 'windows' && hashFiles('_scripts/windows.just', '_scripts/common.just', '_scripts/install_windows_ffmpeg.ps1') || hashFiles('_scripts/common.just', '_scripts/android.just', '_scripts/linux.just', '_scripts/mdk_sdk_manifest.json', '_scripts/install_mdk_sdk.py') }}
      - name: Dependencies cache
        id: extcache
        uses: actions/cache@v4
        with:
          path: '${{ github.workspace }}/ext/'
          key: ${{ matrix.targets.type }}-gyroflow-niyien-ext-${{ matrix.targets.type == 'ios' && hashFiles('_scripts/ios.just', '_scripts/common.just', '_scripts/ios_native_deps.py') || matrix.targets.type == 'macos' && hashFiles('_scripts/macos.just') || matrix.targets.type == 'windows' && hashFiles('_scripts/windows.just', '_scripts/common.just', '_scripts/install_windows_ffmpeg.ps1') || hashFiles('_scripts/common.just', '_scripts/android.just', '_scripts/linux.just', '_scripts/mdk_sdk_manifest.json', '_scripts/install_mdk_sdk.py') }}

      # NeuFlow v2 Burn (default feature) does not require Vulkan SDK at build
      # OR runtime: burn-onnx ModelGen is a host-side tool (ndarray, no GPU);
      # wgpu picks DX12 on Windows / Metal on Mac at runtime. The install step
      # is intentionally left disabled and is only relevant if a future build
      # forces wgpu's Vulkan backend explicitly.
      # - name: Prepare Vulkan SDK
      #   uses: johnnynunez/setup-vulkan-sdk@v1
      #   with:
      #     vulkan-query-version: 1.4.304.1
      #     vulkan-components: Vulkan-Headers
      #     vulkan-use-cache: true

      - name: Force qml-video-rs rebuild (UNIX)
        if: ${{ matrix.targets.os != 'windows-2022' && matrix.targets.type != 'ios' }}
        run: |
          rm -rf ${{ github.workspace }}/target/*/deploy/build/qml-video-rs*
          rm -rf ${{ github.workspace }}/target/deploy/build/qml-video-rs*
      - name: Force qml-video-rs rebuild (Win)
        if: ${{ matrix.targets.os == 'windows-2022' }}
        run: |
          rm -r -force ${{ github.workspace }}/target/deploy/build/qml-video-rs* -ErrorAction SilentlyContinue
          rm -r -force ${{ github.workspace }}/target/x86_64-pc-windows-msvc/deploy/build/qml-video-rs* -ErrorAction SilentlyContinue
          rm -r -force ${{ github.workspace }}/target/release/build/qml-video-rs* -ErrorAction SilentlyContinue

      - name: Install Mac certificates
        if: ${{ matrix.targets.os == 'macos-14' || matrix.targets.os == 'macos-15' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATES }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Save keystore to file
        if: ${{ matrix.targets.type == 'android' }}
        run: |
          if (-not "${{ secrets.ANDROID_RELEASE_KEYSTORE }}") {
            if ("${{ github.ref_type }}" -eq "tag") {
              throw "ANDROID_RELEASE_KEYSTORE is required for Android tag releases"
            }
            Write-Host "ANDROID_RELEASE_KEYSTORE is empty; Android workflow_dispatch will build without release signing"
            exit 0
          }
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE }}" > ${{ github.workspace }}/android_release.keystore.b64
          certutil -decode ${{ github.workspace }}/android_release.keystore.b64 ${{ github.workspace }}/android_release.keystore

      - uses: extractions/setup-just@v2

      - name: Build gyroflow(niyien) (macOS)
        if: ${{ matrix.targets.type == 'macos' }}
        env:
          SIGNING_FINGERPRINT: ${{ secrets.MACOS_CERTIFICATE_FINGERPRINT }}
        run: |
          just install-deps
          just deploy universal
          xcrun notarytool submit --wait --apple-id ${{ secrets.MACOS_ACCOUNT_USER }} --team-id ${{ secrets.MACOS_TEAM }} --password ${{ secrets.MACOS_ACCOUNT_PASS }} ${{ github.workspace }}/_deployment/_binaries/gyroflow-niyien-mac-universal.dmg
          xcrun stapler staple --verbose ${{ github.workspace }}/_deployment/_binaries/gyroflow-niyien-mac-universal.dmg

      - name: Build gyroflow(niyien) (Linux)
        id: linux_build
        if: ${{ matrix.targets.type == 'linux' }}
        run: just deploy docker

      - name: Prepare Linux smoke test runtime
        if: ${{ matrix.targets.type == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0

      - name: Smoke test Linux tar package
        if: ${{ matrix.targets.type == 'linux' }}
        run: |
          set -euo pipefail
          packages="${{ github.workspace }}/_deployment/_binaries"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf "$packages/gyroflow-niyien-linux64.tar.gz" -C "$smoke_dir"
          export LD_LIBRARY_PATH="$smoke_dir/Gyroflow/lib"
          export QT_QPA_PLATFORM=offscreen
          ldd_output="$(ldd "$smoke_dir/Gyroflow/gyroflow-niyien")"
          printf '%s\n' "$ldd_output"
          if grep -q 'not found' <<<"$ldd_output"; then
            exit 1
          fi
          "$smoke_dir/Gyroflow/gyroflow-niyien" --version

      - name: Smoke test Linux AppImage package
        if: ${{ !cancelled() && matrix.targets.type == 'linux' && steps.linux_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          packages="${{ github.workspace }}/_deployment/_binaries"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          cd "$smoke_dir"
          "$packages/gyroflow-niyien-linux64.AppImage" --appimage-extract
          appdir="$smoke_dir/squashfs-root"
          export LD_LIBRARY_PATH="$appdir/lib:$appdir/lib/x86_64-linux-gnu:$appdir/lib/x86_64-linux-gnu/security:$appdir/usr/lib/x86_64-linux-gnu:$appdir/usr/lib/llvm-7/lib:$appdir/lib/x86_64"
          export QT_QPA_PLATFORM=offscreen
          ldd_output="$(ldd "$appdir/gyroflow-niyien")"
          printf '%s\n' "$ldd_output"
          if grep -q 'not found' <<<"$ldd_output"; then
            exit 1
          fi
          "$appdir/AppRun" --version

      - name: Build gyroflow(niyien) (Windows)
        if: ${{ matrix.targets.type == 'windows' }}
        run: |
          just install-deps
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::install-deps failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }
          just deploy

      - name: Build gyroflow(niyien) (Android)
        if: ${{ matrix.targets.type == 'android' }}
        env:
          KEY_STORE_ALIAS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_ALIAS }}
          KEY_STORE_PASS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASS }}
          BUILD_PROFILE: deploy
        run: |
          $Env:JAVA_HOME = $Env:JAVA_HOME_21_X64
          if (Test-Path "${{ github.workspace }}/android_release.keystore") {
            $Env:KEY_STORE_PATH = "${{ github.workspace }}/android_release.keystore"
          } else {
            $Env:KEY_STORE_ALIAS = ""
            $Env:KEY_STORE_PASS = ""
          }
          just android install-deps
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::android install-deps failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }
          just android deploy

      - name: Build IPA
        if: matrix.targets.type == 'ios'
        env:
          IOS_UPLOAD_ENABLED: ${{ steps.config.outputs.upload_enabled }}
        run: |
          just ios install-deps
          if [ "$IOS_UPLOAD_ENABLED" = "true" ]; then
            just ios build-ipa
          else
            just ios build-and-package deploy unsigned
          fi

      - name: Verify IPA metadata
        id: package
        if: matrix.targets.type == 'ios'
        env:
          IOS_REQUIRE_DISTRIBUTION: ${{ steps.config.outputs.upload_enabled }}
        run: python3 _scripts/ios_ci.py prepare-artifact

      - name: Save IPA and debug symbols
        if: matrix.targets.type == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: niyien-ios
          compression-level: 0
          if-no-files-found: error
          path: |
            _deployment/_binaries/NiYien-*.ipa
            _deployment/_binaries/ios/NiYien.app.dSYM/
            _deployment/_binaries/ios/build-receipt.json

      - name: Upload using existing Apple account
        if: matrix.targets.type == 'ios' && steps.config.outputs.upload_enabled == 'true' && steps.config.outputs.upload_mode == 'account'
        env:
          MACOS_ACCOUNT_USER: ${{ secrets.MACOS_ACCOUNT_USER }}
          MACOS_ACCOUNT_PASS: ${{ secrets.MACOS_ACCOUNT_PASS }}
        run: python3 _scripts/ios_ci.py upload-account

      - name: Upload using App Store Connect API
        if: matrix.targets.type == 'ios' && steps.config.outputs.upload_enabled == 'true' && steps.config.outputs.upload_mode == 'api'
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.package.outputs.ipa_path }}
          app-type: ios
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID || secrets.APPSTORE_ISSUER_ID || secrets.MACOS_ITCONNECT_ISSUER }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID || secrets.APPSTORE_API_KEY_ID || secrets.MACOS_ITCONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY || secrets.MACOS_ITCONNECT_KEY }}
          backend: appstore-api
          wait-for-processing: 'false'

      # Release flow (tag push) — V7 + archive:false: raw bytes attached directly to GitHub release.
      - name: Upload Windows package (release)
        if: ${{ matrix.targets.type == 'windows' && startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: gyroflow-niyien-windows64.zip
          path: _deployment/_binaries/gyroflow-niyien-windows64.zip
          archive: false
          if-no-files-found: error

      - name: Upload Windows setup (release)
        if: ${{ matrix.targets.type == 'windows' && startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: gyroflow-niyien-windows64-setup.exe
          path: _deployment/_binaries/gyroflow-niyien-windows64-setup.exe
          archive: false
          if-no-files-found: error

      - name: Upload macOS package (release)
        if: ${{ matrix.targets.type == 'macos' && startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: gyroflow-niyien-mac-universal.dmg
          path: _deployment/_binaries/gyroflow-niyien-mac-universal.dmg
          archive: false
          if-no-files-found: error

      - name: Upload Android package (release)
        if: ${{ matrix.targets.type == 'android' && startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: gyroflow-niyien.apk
          path: _deployment/_binaries/gyroflow-niyien.apk
          archive: false
          if-no-files-found: error

      - name: Upload Linux AppImage (release)
        if: ${{ matrix.targets.type == 'linux' && startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: gyroflow-niyien-linux64.AppImage
          path: _deployment/_binaries/gyroflow-niyien-linux64.AppImage
          archive: false
          if-no-files-found: error

      - name: Upload Linux tar archive (release)
        if: ${{ matrix.targets.type == 'linux' && startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: gyroflow-niyien-linux64.tar.gz
          path: _deployment/_binaries/gyroflow-niyien-linux64.tar.gz
          archive: false
          if-no-files-found: error

      # Nightly flow (workflow_dispatch) — V4 with short name + no pre-zip.
      # V4's auto-archive wraps the raw build output once, so nightly.link URL
      # `<short_name>.zip` returns a wrapper containing the deliverable file.
      # Mirrors gyroflow/gyroflow upstream pattern (Gyroflow-windows.zip wrapping
      # Gyroflow-windows64.zip).
      - name: Upload Windows package (nightly)
        if: ${{ matrix.targets.type == 'windows' && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: gyroflow-niyien-windows
          path: _deployment/_binaries/gyroflow-niyien-windows64.zip
          if-no-files-found: error

      - name: Upload Windows setup (nightly)
        if: ${{ matrix.targets.type == 'windows' && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: gyroflow-niyien-win-setup
          path: _deployment/_binaries/gyroflow-niyien-windows64-setup.exe
          if-no-files-found: error

      - name: Upload macOS package (nightly)
        if: ${{ matrix.targets.type == 'macos' && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: gyroflow-niyien-mac
          path: _deployment/_binaries/gyroflow-niyien-mac-universal.dmg
          if-no-files-found: error

      - name: Upload Android package (nightly)
        if: ${{ matrix.targets.type == 'android' && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: gyroflow-niyien-android
          path: _deployment/_binaries/gyroflow-niyien.apk
          if-no-files-found: error

      - name: Upload Linux AppImage (nightly)
        if: ${{ matrix.targets.type == 'linux' && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: gyroflow-niyien-linux-appimage
          path: _deployment/_binaries/gyroflow-niyien-linux64.AppImage
          if-no-files-found: error

      - name: Upload Linux tar archive (nightly)
        if: ${{ matrix.targets.type == 'linux' && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: gyroflow-niyien-linux-tar
          path: _deployment/_binaries/gyroflow-niyien-linux64.tar.gz
          if-no-files-found: error

  github_release:
    name: Create GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release_artifacts
          pattern: gyroflow-niyien*
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          files: |
            ./release_artifacts/gyroflow-niyien-windows64-setup.exe
            ./release_artifacts/gyroflow-niyien-windows64.zip
            ./release_artifacts/gyroflow-niyien-mac-universal.dmg
            ./release_artifacts/gyroflow-niyien-linux64.AppImage
            ./release_artifacts/gyroflow-niyien-linux64.tar.gz
            ./release_artifacts/gyroflow-niyien.apk

