[package]
name = "gyroflow-core"
version.workspace = true
authors = ["Adrian <adrian.eddy@gmail.com>", "Elvin Chen"]
edition = "2024"
build = "build.rs"

[lib]
name = "gyroflow_core"
path = "lib.rs"

# Dev-only offline replay tool (change sync-likelihood-nuisance, spec
# sync-decision-replay). Feature-gated so it never enters release packaging:
#   cargo run -p gyroflow-core --features sync-replay --bin sync_replay -- --help
[[bin]]
name = "sync_replay"
path = "bin/sync_replay.rs"
required-features = ["sync-replay"]

[dependencies]
telemetry-parser = { git = "https://github.com/NiYien/telemetry-parser.git", branch = "niyien" }
#ahrs = { version = "0.5.0", features = ["field_access"] }
ahrs = { version = "0.8", features = ["field_access"] }

stabilize_spirv = { path = "./gpu/stabilize_spirv" }

# NiYien fork — adds full_sync_with_curve + eval_residuals/solve_gain (change sync-likelihood-nuisance).
rs-sync = { git = "https://github.com/NiYien/rs-sync.git", rev = "25f4e3c" }
#rs-sync = { path = "../../../rs-sync" }

argmin = { version = "0.11.0", default-features = false }
argmin-math = { version = "0.5.1", default-features = false, features = ["nalgebra_v0_34"] }

nalgebra = { version = "0.34", features = ["serde-serialize"] }
rayon = "1.11"
biquad = "0.6.0"
fastrand = "2.3.0"
lazy_static = "1.5.0"
parking_lot = "0.12.5"
regex = "1.12"
bincode = { version = "2.0", features = ["serde"] }
serde = "1.0"
serde_json = "1.0"
toml = "0.9"
crc32fast = "1.5.0"
byteorder = "1.5.0"
line_drawing = "1.0.1"
rand = "0.10.1"
time = { version = "0.3.47", features = ["local-offset"] }
itertools = "0.14.0"
num = "0.4.3"
base91 = "0.1.0"
bitflags = "2.11"
enum_delegate = "0.2.0"
simple-easing = "1.0.2"
half = "2.7"
lru = "0.16"
thiserror = "2.0.18"
ciborium = "0.2.2"
dyn-clone = "1.0"
app_dirs2 = { git = "https://github.com/app-dirs-rs/app_dirs2.git", version = "2.5" }
whoami = "2.1"

akaze = { version = "*", git = "https://github.com/rust-cv/cv.git", rev = "d271a9a", features = ["rayon"] }
eight-point = { version = "*", git = "https://github.com/rust-cv/cv.git", rev = "d271a9a" }
cv-pinhole = { version = "*", git = "https://github.com/rust-cv/cv.git", rev = "d271a9a" }
cv-core = { version = "*", git = "https://github.com/rust-cv/cv.git", rev = "d271a9a" }
sample-consensus = "1.0.2"
arrsac = "0.11"
rand_xoshiro = "0.7.0"
image = { version = "0.25", default-features = false }
space = { version = "0.17", features = ["alloc"] }
bitarray = { version = "0.9", features = ["space"] }
enterpolation = "0.3.0"
libloading = "0.9"
libc = "0.2"
bytemuck = "1.25"
ash = "0.38.0"
pollster = "0.4.0"
futures-intrusive = "0.5.0"
flate2 = "1.1"
walkdir = "2.5.0"
url = "2.5.8"
urlencoding = "2.1.3"
log = "0.4"
ocl = { version = "0.19.7", optional = true }
ocl-interop = { version = "0.1.6", optional = true }
rustfft = "6.4.1"
exr = "1.74"
opencv = { version = "0.98", default-features = false, features = [ "calib3d", "features2d", "imgproc", "optflow", "clang-runtime" ], optional = true } #"imgcodecs","objdetect","sfm",
median = "0.3"

wgpu = { version = "29", features = ["spirv", "naga-ir"] }
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
neuflow-trace-shared = { path = "../../vendor/neuflow-trace/neuflow-trace-shared" }

# Burn framework for NeuFlow v2 inference (Win Vulkan / Mac Metal backend).
# Burn / burn-store / cubecl-runtime are declared per-target so Linux / iOS /
# Android never pull them in. The cargo feature `neuflow-burn` is still the
# user-facing on/off switch; build.rs synthesises a `neuflow_burn_enabled`
# cfg that combines the feature + supported target. See change
# burn-platform-and-ai-sync-toggle.

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
burn = { git = "https://github.com/tracel-ai/burn", rev = "ed4d313b16ac348093cfa0f979774b4312b17058", default-features = false, features = ["std", "wgpu", "metal", "autotune", "fusion"], optional = true }
burn-store = { git = "https://github.com/tracel-ai/burn", rev = "ed4d313b16ac348093cfa0f979774b4312b17058", default-features = false, features = ["std", "burnpack"], optional = true }
cubecl-runtime = { git = "https://github.com/tracel-ai/cubecl", rev = "b5983f200457271d7e336f0db903eda54834b924", default-features = false, features = ["std"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
burn = { git = "https://github.com/tracel-ai/burn", rev = "ed4d313b16ac348093cfa0f979774b4312b17058", default-features = false, features = ["std", "wgpu", "vulkan", "autotune", "fusion"], optional = true }
burn-store = { git = "https://github.com/tracel-ai/burn", rev = "ed4d313b16ac348093cfa0f979774b4312b17058", default-features = false, features = ["std", "burnpack"], optional = true }
cubecl-runtime = { git = "https://github.com/tracel-ai/cubecl", rev = "b5983f200457271d7e336f0db903eda54834b924", default-features = false, features = ["std"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [ "Win32_System_Com", "Win32_System_Console", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_Foundation", "Wdk_Foundation", "Win32_System_LibraryLoader",
             "Win32_Graphics_Dwm", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dxgi",
             "Win32_Security", "Win32_Security_Authorization", "Win32_System_WindowsProgramming", "Win32_System_Threading", "Win32_System_Registry",
             "Win32_Storage_Packaging_Appx", "Win32_Storage_FileSystem" ]

[features]
default = ["cache-gyro-metadata"]
use-opencl = ["ocl", "ocl-interop"]
use-opencv = ["opencv"]
bundle-lens-profiles = []
cache-gyro-metadata = []
neuflow-ort = ["dep:ort"]
neuflow-burn = ["dep:burn", "dep:burn-store", "dep:cubecl-runtime", "dep:burn-onnx"]
neuflow = ["neuflow-ort", "neuflow-burn"]
# Dev-only: enables the sync_replay offline decision-replay bin.
sync-replay = []

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk = { version = "0.9.0", features = ["media", "api-level-26"] }
ndk-sys = { version = "0.6.0" }
ndk-context = { version = "0.1.1" }

[dev-dependencies]
serial_test = "3"
tempfile = "3"
which = "6"

[build-dependencies]
ureq = "3.3"
flate2 = "1.1"
tar = "0.4"
# Used by build.rs only when feature `neuflow-burn` is enabled. Optional so a
# default build neither downloads nor compiles it. Generates Rust + .bpk
# artifacts from the bundled NeuFlow v2 ONNX file into $OUT_DIR/burn_onnx/.
burn-onnx = { git = "https://github.com/tracel-ai/burn-onnx", rev = "8f578180c025a702ec902c9fdec8133db2daec90", optional = true }
