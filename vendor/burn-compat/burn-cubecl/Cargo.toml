[package]
name = "burn-cubecl"
version = "0.22.0-pre.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science"]
description = "Generic backend that can be compiled just-in-time to any shader language target"
documentation = "https://docs.rs/burn-cubecl"
keywords = ["deep-learning", "machine-learning", "gpu"]
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-cubecl"

[features]
default = [
    "autotune",
    "std",
    "fusion",
    "cubecl/default",
    "burn-backend/default",
    "burn-fusion?/default",
    "burn-cubecl-fusion?/default",
]
std = [
    "cubecl/std",
    "burn-backend/std",
    "burn-fusion?/std",
    "burn-cubecl-fusion?/std",
]
doc = ["default"]

tracing = [
    "dep:tracing",
    "cubecl/tracing",
    "burn-std/tracing",
    "burn-backend/tracing",
    "burn-fusion?/tracing",
    "burn-cubecl-fusion?/tracing",
]

autotune = ["burn-cubecl-fusion?/autotune"]
autotune-checks = [
    "autotune",
    "cubecl/autotune-checks",
    "burn-cubecl-fusion?/autotune-checks",
]

fusion = ["burn-fusion", "burn-cubecl-fusion"]
fusion-experimental = ["fusion"]

template = []

distributed = [
    "std",
    "burn-backend/distributed",
    "burn-fusion?/distributed",
]

[dependencies]
burn-cubecl-fusion = { git = "https://github.com/tracel-ai/burn", rev = "ca57d897ca7e80f4f3785e83c076dcf2fa36ade6", package = "burn-cubecl-fusion", version = "=0.22.0-pre.1", default-features = false, optional = true }
burn-fusion = { git = "https://github.com/tracel-ai/burn", rev = "ca57d897ca7e80f4f3785e83c076dcf2fa36ade6", package = "burn-fusion", version = "=0.22.0-pre.1", default-features = false, optional = true }
burn-ir = { git = "https://github.com/tracel-ai/burn", rev = "ca57d897ca7e80f4f3785e83c076dcf2fa36ade6", package = "burn-ir", version = "=0.22.0-pre.1", default-features = false }
burn-std = { git = "https://github.com/tracel-ai/burn", rev = "ca57d897ca7e80f4f3785e83c076dcf2fa36ade6", package = "burn-std", version = "=0.22.0-pre.1", default-features = false, features = ["cubecl"] }
burn-backend = { git = "https://github.com/tracel-ai/burn", rev = "ca57d897ca7e80f4f3785e83c076dcf2fa36ade6", package = "burn-backend", version = "=0.22.0-pre.1", default-features = false, features = ["cubecl"] }
cubecl = { git = "https://github.com/tracel-ai/cubecl", rev = "0751cf6a5005c1755c1cd44d1c9383e7b1de814c", default-features = false, features = ["stdlib"] }
cubek = { git = "https://github.com/tracel-ai/cubek", rev = "0d259b53ff086b727dc1cdf001d064585bbc78bc", default-features = false, features = [
    "attention",
    "matmul",
    "convolution",
    "interpolate",
    "pool",
    "reduce",
    "random",
    "quantization",
    "stdlib",
    "fft",
] }
tracing = { version = "0.1.44", default-features = false, features = ["attributes"], optional = true }

derive-new = { version = "0.7.0", default-features = false }
log = { version = "0.4.29", default-features = false }

# Async
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }

# Template
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
text_placeholder = { version = "0.5.1", features = ["struct_context"] }

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
